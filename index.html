<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faturamento FTL — Mural</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    /* mesma paleta do painel Meli B2B */
    --bg:        #0a0c11;
    --card:      #12151b;
    --card-2:    #171b23;
    --line:      rgba(255,255,255,0.07);
    --line-soft: rgba(255,255,255,0.045);
    --line-strong: rgba(255,255,255,0.16);
    --ink:       #f3f5f8;
    --ink-2:     #8a93a6;
    --ink-3:     #57606f;
    --accent:    #437fef;
    --brand:     #0a2f74;
    --ftl:       #f1860a;
    --opd:       #437fef;
    --exp:       #22c55e;
    --hist:      #8a93a6;
    --ano:       #437fef;
    --acum:      #f1860a;
    --pos:       #22c55e;
    --neg:       #ef4444;
    --pos-bg:    rgba(34,197,94,0.14);
    --neg-bg:    rgba(239,68,68,0.14);
    --grid:      rgba(255,255,255,0.06);
    --r:         0.75rem;
    --font-ui:   "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html {
    font-size: calc(0.72vh + 0.42vw);
    background: var(--bg);
    font-variant-numeric: tabular-nums;
    color-scheme: dark;
  }
  body {
    margin: 0; height: 100vh; height: 100dvh; overflow: hidden;
    background: var(--bg);
    background-image:
      radial-gradient(1000px 420px at 8% -12%, rgba(59,130,246,0.06), transparent 60%),
      radial-gradient(800px 360px at 100% -6%, rgba(59,130,246,0.04), transparent 55%);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  .board {
    height: 100%; padding: 1.1rem 1.4rem 1.2rem;
    display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 0.9rem;
  }

  .top {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 0.85rem; flex-wrap: wrap; }
  .brand h1 {
    font-family: var(--font-ui); font-weight: 800; font-size: 2.15rem;
    letter-spacing: -.025em; margin: 0; line-height: 1;
  }
  .brand .tag {
    font-family: var(--font-ui); font-size: 0.78rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .brand .sep { width: 1px; height: 1.2rem; background: var(--line-strong); display: inline-block; }
  .brand .scope { font-size: 0.92rem; color: var(--ink-3); }
  .stampbar { display: flex; align-items: flex-end; gap: 1.6rem; }
  .stampbar div { text-align: right; }
  .stampbar .k {
    font-family: var(--font-ui); font-size: 0.66rem;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
  }
  .stampbar .v {
    font-family: var(--font-ui); font-weight: 600; font-size: 1.18rem;
    letter-spacing: -.01em; margin-top: .1rem; font-variant-numeric: tabular-nums;
  }
  .logo {
    background: #fff; border-radius: .5rem; padding: .45rem .65rem;
    display: flex; align-items: center; flex: none;
    box-shadow: 0 .15rem .7rem rgba(0,0,0,.35);
  }
  .logo img { display: block; height: 1.65rem; width: auto; }
  .live { display: inline-flex; align-items: center; gap: .4rem; }
  .pulse {
    width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 rgba(63,181,164,.55); animation: pulse 2.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(63,181,164,.5); }
    70% { box-shadow: 0 0 0 .55rem rgba(63,181,164,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,181,164,0); }
  }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; }
  .kpi {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 0.75rem 1rem 0.8rem; position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--line); }
  .kpi.a::before { background: var(--accent); }
  .kpi.b::before { background: var(--opd); }
  .kpi.c::before { background: var(--ftl); }
  .kpi .label {
    font-family: var(--font-ui); font-size: 0.68rem;
    letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3);
  }
  .kpi .value {
    font-family: var(--font-ui); font-weight: 700; font-size: 2.35rem;
    letter-spacing: -.03em; font-variant-numeric: tabular-nums;
    line-height: 1.08; margin-top: .2rem; white-space: nowrap;
  }
  .kpi .value .cur { font-size: .5em; font-weight: 500; color: var(--ink-3); margin-right: .18em; }
  .kpi .foot {
    font-size: 0.82rem; color: var(--ink-3); margin-top: .25rem;
    display: flex; align-items: center; gap: .55rem; flex-wrap: wrap;
  }
  .kpi .foot .ref {
    color: var(--ink-3); opacity: .8; white-space: nowrap;
    padding-left: .55rem; border-left: 1px solid var(--line-strong);
  }
  .chip {
    display: inline-flex; align-items: center; gap: .25rem;
    font-family: var(--font-ui); font-size: 0.78rem; font-weight: 600;
    padding: .1rem .5rem; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .chip.up { color: var(--pos); background: var(--pos-bg); }
  .chip.down { color: var(--neg); background: var(--neg-bg); }

  .strip { display: grid; grid-template-columns: 1.35fr 0.85fr 1fr 1.15fr; gap: 0.8rem; min-height: 0; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
    padding: 0.85rem 1rem 0.9rem; min-height: 0;
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  .col { display: grid; grid-template-rows: 1.15fr 1fr; gap: 0.8rem; min-height: 0; }
  .phead { display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; flex-wrap: wrap; }
  .panel h2 {
    font-family: var(--font-ui); font-weight: 600; font-size: 1.28rem;
    letter-spacing: -.01em; margin: 0;
  }
  .phead .sub {
    font-family: var(--font-ui); font-size: 0.82rem;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3);
  }
  .legend { display: flex; gap: .8rem; }
  .legend span {
    display: inline-flex; align-items: center; gap: .35rem;
    font-family: var(--font-ui); font-size: 0.86rem; color: var(--ink-2);
  }
  .dot { width: .62rem; height: .62rem; border-radius: 2px; display: inline-block; flex: none; }

  .plot { flex: 1 1 auto; min-height: 0; position: relative; }
  .plot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ax { font-family: var(--font-ui); fill: var(--ink-3); }
  .barlab { font-family: var(--font-ui); font-weight: 700; fill: var(--ink); }
  .foot-note { font-size: 0.95rem; color: var(--ink-3); line-height: 1.35; }
  .foot-note strong { color: var(--ink); }

  .rows { display: flex; flex-direction: column; gap: .55rem; flex: 1 1 auto; justify-content: space-evenly; }
  .row-item { display: grid; grid-template-columns: 1fr auto; gap: .35rem .6rem; align-items: baseline; }
  .row-name { font-size: 1.4rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: .45rem; }
  .row-val {
    font-family: var(--font-ui); font-size: 1.4rem; font-weight: 600;
    font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap;
  }
  .row-val em { font-style: normal; color: var(--ink-3); font-weight: 400; margin-left: .5rem; }
  .track { grid-column: 1 / -1; height: .8rem; border-radius: .25rem; background: var(--line-soft); overflow: hidden; }
  .fill { height: 100%; border-radius: .25rem; }

  .fc-total { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
  .fc-total b {
    font-family: var(--font-ui); font-weight: 700; font-size: 2.15rem;
    letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  }
  .fc-total span { font-size: 0.95rem; color: var(--ink-3); }
  .fc-list { display: flex; flex-direction: column; gap: .5rem; flex: 1 1 auto; }
  .fc-item {
    display: flex; align-items: center; justify-content: space-between; gap: .6rem;
    flex: 1 1 0; min-height: 0;
    padding: .45rem .7rem; background: var(--card-2);
    border: 1px solid var(--line-soft); border-radius: .55rem;
  }
  .fc-item .n { font-size: 1.16rem; }
  .fc-item .r {
    display: block; font-family: var(--font-ui);
    font-size: 0.8rem; color: var(--ink-3); letter-spacing: .06em; margin-top: .05rem;
  }
  .fc-item .v {
    font-family: var(--font-ui); font-size: 1.16rem; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  .cli { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; justify-content: space-between; }
  .cli-row {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: .3rem .7rem; align-items: baseline; align-content: start;
    flex: 1 1 0; min-height: 0;
    padding-bottom: .3rem; border-bottom: 1px solid var(--line-soft);
  }
  .cli-row:last-child { border-bottom: none; }
  .cli-name { font-size: 1.14rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cli-val {
    font-family: var(--font-ui); font-size: 1.14rem; font-weight: 500;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .cli-dlt {
    font-family: var(--font-ui); font-size: 1rem; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; min-width: 6.2rem;
  }
  .cli-dlt.z { color: var(--ink-3); font-weight: 400; }
  .cli-dlt.p { color: var(--pos); }
  .cli-bar { grid-column: 1 / -1; height: .28rem; border-radius: .2rem; background: var(--line-soft); overflow: hidden; }
  .cli-bar i { display: block; height: 100%; border-radius: .2rem; background: var(--accent); }

  .empty {
    padding: .6rem .8rem; border-radius: .55rem; background: var(--card-2);
    border: 1px dashed var(--line); color: var(--ink-3); font-size: 0.82rem; line-height: 1.35;
  }

  /* aviso de dados ausentes / desatualizados */
  #alerta {
    position: fixed; inset: auto 1.4rem 1.1rem auto;
    background: var(--card); border: 1px solid var(--neg); color: var(--ink);
    border-radius: .6rem; padding: .6rem .9rem; font-size: .85rem; max-width: 34rem;
    box-shadow: 0 .6rem 2rem rgba(0,0,0,.5);
  }
  #alerta b { color: var(--neg); }
  #alerta.hide { display: none; }
  .chip.hide { display: none; }

  @media (max-aspect-ratio: 1/1) {
    .strip { grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); }
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---------------- ajustes deste painel ---------------- */
  .strip { grid-template-columns: 1.62fr 1fr; }
  .col.esq { grid-template-rows: 1.32fr 1fr; }
  .col.dir { grid-template-rows: 0.92fr 1fr; }

  .insight {
    font-size: 0.95rem; color: var(--ink-2); line-height: 1.3;
    padding: .45rem .7rem; border-radius: .5rem;
    background: var(--card-2); border: 1px solid var(--line-soft);
  }
  .insight b { color: var(--ink); font-weight: 700; }

  /* comparativo do acumulado */
  .cmp { display: flex; flex-direction: column; gap: .7rem; flex: 1 1 auto; justify-content: space-evenly; }
  .cmp-item { display: grid; grid-template-columns: 1fr auto; gap: .3rem .6rem; align-items: baseline; }
  .cmp-name { font-size: 1.05rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: .45rem; }
  .cmp-val {
    font-family: var(--font-ui); font-size: 1.3rem; font-weight: 700;
    font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap;
  }
  .cmp-val em { font-style: normal; font-weight: 500; font-size: .8em; color: var(--ink-3); margin-left: .45rem; }
  .cmp-track { grid-column: 1 / -1; height: .85rem; border-radius: .28rem; background: var(--line-soft); overflow: hidden; }
  .cmp-track i { display: block; height: 100%; border-radius: .28rem; }
  .cmp-item.fantasma .cmp-track i {
    background-image: repeating-linear-gradient(135deg,
      rgba(255,255,255,.22) 0 .35rem, rgba(255,255,255,0) .35rem .7rem);
  }
  .cmp-item.fantasma .cmp-name { color: var(--ink-3); }

  /* ranking de clientes */
  .rank { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; justify-content: space-between; }
  .rank-row {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: .22rem .7rem; align-items: baseline; align-content: start;
    flex: 1 1 0; min-height: 0;
    padding-bottom: .2rem; border-bottom: 1px solid var(--line-soft);
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-name { font-size: 1.02rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-val {
    font-family: var(--font-ui); font-size: 1.02rem; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .rank-share {
    font-family: var(--font-ui); font-size: 0.92rem; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right;
    min-width: 3.4rem; color: var(--ink-3);
  }
  .rank-bar { grid-column: 1 / -1; height: .26rem; border-radius: .2rem; background: var(--line-soft); overflow: hidden; }
  .rank-bar i { display: block; height: 100%; border-radius: .2rem; background: var(--ano); }
  .rank-bar i.novo { background: var(--pos); }

  .legend span.hist i.dot { background: var(--hist); }
</style>
</head>

<script>
window.__FAT_INIT = function () {
  "use strict";

  /* ---------------- formatação ---------------- */
  const br = (n, d) => n.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
  const cur0 = n => br(Math.round(n), 0);
  /* valores grandes: 12,6 mi / 920 mil */
  const curto = n => {
    const a = Math.abs(n);
    if (a >= 1e6) return br(n / 1e6, a >= 1e7 ? 1 : 2) + " mi";
    if (a >= 1e3) return br(n / 1e3, 0) + " mil";
    return cur0(n);
  };
  const pct = (n, d) => br(n * 100, d === undefined ? 1 : d) + "%";
  const money = n => '<span class="cur">R$</span>' + cur0(n);
  const soma = a => a.reduce((x, y) => x + y, 0);
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize);
  const el = id => document.getElementById(id);
  const txt = (id, v) => { const e = el(id); if (e) e.textContent = v; };
  const html = (id, v) => { const e = el(id); if (e) e.innerHTML = v; };
  const MESES_EXT = { Jan: "janeiro", Fev: "fevereiro", Mar: "março", Abr: "abril", Mai: "maio", Jun: "junho",
                      Jul: "julho", Ago: "agosto", Set: "setembro", Out: "outubro", Nov: "novembro", Dez: "dezembro" };

  /* ---------------- dados ---------------- */
  const D = window.FAT;
  if (!D || !D.anos || !D.anos.length) {
    const a = el("alerta");
    a.innerHTML = '<b>Sem dados.</b> O arquivo <code>dados.js</code> não foi encontrado ou está vazio. ' +
                  'Rode o <b>Atualizar painel.bat</b> na pasta da planilha.';
    a.classList.remove("hide");
    return;
  }
  const M = D.meses;
  const anos = D.anos.slice().sort((a, b) => a.ano - b.ano);
  const atual = anos[anos.length - 1];
  const hist  = anos.length > 1 ? anos[anos.length - 2] : null;

  const nApur = atual.mensal.filter(v => v > 0).length;          /* meses com faturamento */
  const acum  = soma(atual.mensal);
  const acumHistMesmo = hist ? soma(hist.mensal.slice(0, nApur)) : 0;
  const acumHistAno   = hist ? soma(hist.mensal) : 0;
  const media   = nApur ? acum / nApur : 0;
  const projecao = media * 12;
  const maxMes = Math.max(...atual.mensal, ...(hist ? hist.mensal : [0]));

  /* ---------------- topo e KPIs ---------------- */
  txt("s-sync", D.atualizado || "—");
  txt("s-period", nApur ? M[0] + " a " + M[nApur - 1] + "/" + atual.ano : "—");
  txt("s-mes", nApur ? (MESES_EXT[M[nApur - 1]] || M[nApur - 1]) + " " + atual.ano : "—");

  txt("k-acum-l", "Acumulado " + atual.ano);
  html("k-acum", money(acum));
  el("k-acum-f").textContent = nApur + (nApur === 1 ? " mês apurado" : " meses apurados");

  if (hist) {
    txt("k-ant-l", "Mesmo período " + hist.ano);
    html("k-ant", money(acumHistMesmo));
    el("k-ant-f").textContent = M[0] + " a " + M[nApur - 1] + "/" + hist.ano;
    const v = acumHistMesmo ? acum / acumHistMesmo - 1 : 0;
    const chip = el("k-ant-chip");
    chip.className = "chip " + (v >= 0 ? "up" : "down");
    chip.textContent = (v >= 0 ? "▲ +" : "▼ ") + pct(Math.abs(v));
  } else {
    el("k-ant").innerHTML = "—";
  }

  txt("k-med-l", "Média mensal " + atual.ano);
  html("k-med", money(media));
  el("k-med-f").textContent = "por mês em " + atual.ano;
  if (hist) el("k-med-ref").textContent = hist.ano + ": " + cur0(acumHistMesmo / (nApur || 1));

  html("k-proj", money(projecao));
  el("k-proj-f").textContent = "média × 12 meses";
  if (hist && acumHistAno) {
    const v = projecao / acumHistAno - 1;
    const chip = el("k-proj-chip");
    chip.className = "chip " + (v >= 0 ? "up" : "down");
    chip.textContent = (v >= 0 ? "▲ +" : "▼ ") + pct(Math.abs(v)) + " vs " + hist.ano;
  }

  /* ---------------- gráfico de barras mensais ---------------- */
  function barras(hostId, valores, opts) {
    const host = el(hostId);
    const W = host.clientWidth, H = host.clientHeight;
    if (!W || !H) return;
    const u = rem();
    const pad = { t: u * (opts.acum ? 2.4 : 1.9), r: u * (opts.acum ? 0.9 : 0.6), b: u * (opts.varia ? 2.9 : 1.9), l: u * 3.6 };
    const iw = Math.max(W - pad.l - pad.r, 10), ih = Math.max(H - pad.t - pad.b, 10);
    /* escala com passos redondos, para o eixo ficar legivel */
    const escala = (maxReal, divs) => {
      const bruto = maxReal * 1.1 / divs;
      if (!(bruto > 0)) return divs;
      const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
      const passo = [1, 2, 2.5, 4, 5, 10].map(x => x * mag).find(c => c >= bruto) || 10 * mag;
      return passo * divs;
    };
    const max = escala(opts.max, 4);
    const step = iw / valores.length;
    const bw = Math.min(u * 2.4, step * 0.5);
    const y = v => pad.t + ih - (v / max) * ih;
    const fsAx  = Math.min(u * 0.78, step * 0.34).toFixed(1);
    const fsLab = Math.min(u * (opts.compacto ? 0.8 : 0.92), step * 0.42).toFixed(1);
    let g = "";

    for (let i = 0; i <= 4; i++) {
      const v = max / 4 * i, yy = y(v);
      g += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + css("--grid") + '" stroke-width="1"/>';
      g += '<text class="ax" font-size="' + fsAx + '" x="' + (pad.l - u * 0.45) + '" y="' + (yy + u * 0.25) + '" text-anchor="end">' + (v ? curto(v) : "0") + '</text>';
    }

    valores.forEach((v, i) => {
      const cx = pad.l + step * i + step / 2;
      const vazio = !(v > 0);
      if (!vazio) {
        const h = (v / max) * ih, yy = pad.t + ih - h;
        g += '<rect x="' + (cx - bw / 2) + '" y="' + yy + '" width="' + bw + '" height="' + Math.max(h, 1) + '" rx="2.5" fill="' + css(opts.cor) + '"/>';
        g += '<text class="barlab" font-size="' + fsLab + '" x="' + cx + '" y="' + (yy - u * 0.4) + '" text-anchor="middle">' + curto(v) + '</text>';
      } else {
        g += '<line x1="' + (cx - bw / 2) + '" x2="' + (cx + bw / 2) + '" y1="' + (pad.t + ih) + '" y2="' + (pad.t + ih) + '" stroke="' + css("--line-strong") + '" stroke-width="2"/>';
      }
      g += '<text class="ax" font-size="' + fsAx + '" x="' + cx + '" y="' + (pad.t + ih + u * 1.05) + '" text-anchor="middle"' +
           (vazio ? ' opacity=".45"' : '') + '>' + M[i] + '</text>';

      /* variação contra o mesmo mês do ano anterior */
      if (opts.varia && opts.varia[i] !== null && opts.varia[i] !== undefined) {
        const d = opts.varia[i];
        g += '<text font-size="' + fsAx + '" font-weight="700" x="' + cx + '" y="' + (pad.t + ih + u * 2.15) +
             '" text-anchor="middle" fill="' + css(d >= 0 ? "--pos" : "--neg") + '">' +
             (d >= 0 ? "+" : "−") + br(Math.abs(d) * 100, 0) + '%</text>';
      }
    });

    /* linha do acumulado no ano (escala própria) */
    if (opts.acum) {
      const totalAcum = soma(valores);
      const maxA = totalAcum * 1.06 || 1;
      let corrido = 0;
      const pts = [];
      valores.forEach((v, i) => {
        if (!(v > 0)) return;
        corrido += v;
        pts.push([pad.l + step * i + step / 2, pad.t + ih - (corrido / maxA) * ih]);
      });
      if (pts.length) {
        g += '<path d="' + pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ") +
             '" fill="none" stroke="' + css("--acum") + '" stroke-width="2" stroke-dasharray="5,4" opacity=".95"/>';
        pts.forEach(p => { g += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.6" fill="' + css("--acum") + '"/>'; });
        const ult = pts[pts.length - 1];
        g += '<text class="barlab" font-size="' + fsLab + '" x="' + Math.min(ult[0] + u * 0.6, W - pad.r) +
             '" y="' + (ult[1] - u * 0.5) + '" text-anchor="end" fill="' + css("--acum") + '">' + curto(totalAcum) + '</text>';
      }
    }

    host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + opts.aria + '">' + g + '</svg>';
  }

  /* ---------------- painéis ---------------- */
  function desenhar() {
    /* variação mês a mês contra o ano anterior */
    const varia = atual.mensal.map((v, i) => {
      if (!(v > 0) || !hist || !(hist.mensal[i] > 0)) return null;
      return v / hist.mensal[i] - 1;
    });

    txt("t-atual", "Faturamento mensal · " + atual.ano);
    txt("leg-atual", String(atual.ano));
    barras("plot-atual", atual.mensal, {
      max: maxMes, cor: "--ano", acum: true, varia: varia,
      aria: "Faturamento mensal de " + atual.ano
    });

    const iMax = atual.mensal.indexOf(Math.max(...atual.mensal));
    let nota = "Melhor mês: <strong>" + (MESES_EXT[M[iMax]] || M[iMax]) + "</strong> com R$ " + cur0(atual.mensal[iMax]) + ".";
    if (hist) {
      const v = acumHistMesmo ? acum / acumHistMesmo - 1 : 0;
      nota += ' O ano acumula <strong style="color:' + (v >= 0 ? "var(--pos)" : "var(--neg)") + '">' +
              (v >= 0 ? "+" : "") + pct(v) + "</strong> sobre o mesmo período de " + hist.ano +
              ". <span style=\"opacity:.75\">% abaixo de cada mês: variação contra " + hist.ano + ".</span>";
    }
    html("nota-atual", nota);

    if (hist) {
      txt("t-hist", "Histórico · " + hist.ano);
      txt("sub-hist", "fechou " + curto(acumHistAno));
      barras("plot-hist", hist.mensal, {
        max: maxMes, cor: "--hist", compacto: true,
        aria: "Faturamento mensal de " + hist.ano
      });
      const iM = hist.mensal.indexOf(Math.max(...hist.mensal));
      html("nota-hist", "Mesma escala do gráfico acima. Melhor mês de " + hist.ano + ": <strong>" +
           (MESES_EXT[M[iM]] || M[iM]) + "</strong> com R$ " + cur0(hist.mensal[iM]) + ".");
    } else {
      el("plot-hist").innerHTML = "";
      html("nota-hist", '<div class="empty">Sem ano anterior na planilha para comparar.</div>');
    }
  }

  function painelAcumulado() {
    txt("sub-acum", nApur + " de 12 meses");
    const itens = [
      { n: atual.ano + " · acumulado", v: acum, cor: "--ano", cls: "" }
    ];
    if (hist) {
      itens.push({ n: hist.ano + " · mesmo período", v: acumHistMesmo, cor: "--hist", cls: "" });
      itens.push({ n: hist.ano + " · ano fechado", v: acumHistAno, cor: "--hist", cls: "fantasma" });
    }
    itens.push({ n: atual.ano + " · projeção", v: projecao, cor: "--acum", cls: "fantasma" });
    const maxV = Math.max(...itens.map(i => i.v)) || 1;
    el("cmp").innerHTML = itens.map(i =>
      '<div class="cmp-item ' + i.cls + '">' +
        '<div class="cmp-name"><i class="dot" style="background:var(' + i.cor + ')"></i>' + i.n + "</div>" +
        '<div class="cmp-val">' + cur0(i.v) + "</div>" +
        '<div class="cmp-track"><i style="width:' + (i.v / maxV * 100).toFixed(1) + '%;background:var(' + i.cor + ')"></i></div>' +
      "</div>").join("");
  }

  function painelClientes() {
    txt("t-clientes", "Clientes · " + atual.ano);
    txt("sub-clientes", "acumulado · vs " + (hist ? hist.ano : "—"));

    const antPorNome = {};
    if (hist) hist.clientes.forEach(c => { antPorNome[c.n.toLowerCase()] = soma(c.v.slice(0, nApur)); });

    const lista = atual.clientes.map(c => {
      const v = soma(c.v);
      const ant = antPorNome[c.n.toLowerCase()];
      return { n: c.n, v: v, ant: (ant === undefined ? null : ant) };
    }).filter(c => c.v > 0).sort((a, b) => b.v - a.v);

    const maxV = lista.length ? lista[0].v : 1;
    const topo = lista[0];
    if (topo) {
      html("insight", "<b>" + topo.n + "</b> concentra <b>" + pct(topo.v / acum) +
                      "</b> do faturamento do ano · " + lista.length + " clientes ativos");
    }

    const mostra = lista.slice(0, 8);
    const resto = lista.slice(8);
    if (resto.length) mostra.push({ n: "Outros (" + resto.length + ")", v: soma(resto.map(r => r.v)), ant: null, outros: true });

    el("rank").innerHTML = mostra.map(c => {
      let chip = '<span class="rank-share">—</span>';
      if (c.ant !== null && c.ant > 0) {
        const d = c.v / c.ant - 1;
        chip = '<span class="rank-share" style="color:var(' + (d >= 0 ? "--pos" : "--neg") + ')">' +
               (d >= 0 ? "+" : "−") + br(Math.abs(d) * 100, 0) + "%</span>";
      } else if (!c.outros && c.ant === null) {
        chip = '<span class="rank-share" style="color:var(--pos)">novo</span>';
      }
      return '<div class="rank-row">' +
        '<div class="rank-name">' + c.n + "</div>" +
        '<div class="rank-val">' + cur0(c.v) + "</div>" +
        chip +
        '<div class="rank-bar"><i class="' + (c.ant === null && !c.outros ? "novo" : "") +
          '" style="width:' + (c.v / maxV * 100).toFixed(1) + '%"></i></div>' +
      "</div>";
    }).join("");
  }

  painelAcumulado();
  painelClientes();
  desenhar();

  let t;
  addEventListener("resize", function () { clearTimeout(t); t = setTimeout(desenhar, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(desenhar);
};
</script>
